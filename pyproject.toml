[project]
name = "nooa-coder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nooa[cli,memory,viewer]>=0.0.9",
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]

[tool.basedpyright]
# "recommended" (the default) flags every Any/Unknown, which is mostly noise for
# code that handles raw LSP JSON and imports the untyped nooa package.
typeCheckingMode = "standard"
